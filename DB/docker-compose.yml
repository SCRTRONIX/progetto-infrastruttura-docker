services:
  db:
    image: mariadb:latest   
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: vm1
      MARIADB_DATABASE: db_progetto
      MARIADB_USER: felix
      MARIADB_PASSWORD: vm1
    volumes:
      - mariadb_data:/var/lib/mysql 
    networks:
      - rete_docker

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - rete_docker

volumes:
  mariadb_data:

networks:
  rete_docker:
    external: true
